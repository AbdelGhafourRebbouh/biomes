<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomes - Workspace Dashboard</title>
    <style>
        /* CSS Tokens - Easy to style for your visual identity */
        :root {
            --bg-base: #0f0f17;
            --bg-surface: #1a1a26;
            --bg-card: #252538;
            --bg-card-hover: #2f2f47;
            --accent-blue: #89b4fa;
            --accent-green: #a6e3a1;
            --accent-red: #f38ba8;
            --text-main: #cdd6f4;
            --text-muted: #9399b2;
            --border: #36364f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-surface);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .logo-group h1 {
            font-size: 1.4rem;
            color: var(--accent-blue);
            letter-spacing: 0.5px;
        }

        .logo-group p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-create {
            background-color: var(--accent-blue);
            color: var(--bg-base);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-create:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-create:active {
            transform: translateY(0);
        }

        /* DASHBOARD GRID */
        main {
            padding: 30px;
            flex: 1;
        }

        .section-title {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .biomes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        /* BIOME CARDS */
        .biome-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .biome-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .biome-cover {
            height: 140px;
            background-color: #181825;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .biome-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .biome-cover .fallback-icon {
            font-size: 2.5rem;
            opacity: 0.6;
        }

        .biome-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .biome-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .biome-name {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .hotkey-badge {
            background-color: rgba(137, 180, 250, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(137, 180, 250, 0.3);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: 600;
        }

        .app-list-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .app-chip {
            background-color: var(--bg-surface);
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .biome-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
            padding-top: 10px;
        }

        .btn-launch {
            flex: 1;
            background-color: var(--accent-green);
            color: var(--bg-base);
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .btn-launch:hover { opacity: 0.85; }

        .btn-delete {
            background-color: transparent;
            color: var(--accent-red);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-delete:hover {
            border-color: var(--accent-red);
            background-color: rgba(243, 139, 168, 0.1);
        }

        /* ADD NEW BIOME CARD */
        .add-card {
            border: 2px dashed var(--border);
            background-color: transparent;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            color: var(--text-muted);
            border-radius: 12px;
            transition: border-color 0.2s, color 0.2s, background-color 0.2s;
        }

        .add-card:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            background-color: rgba(137, 180, 250, 0.03);
        }

        .add-card .plus-icon {
            font-size: 2.5rem;
        }

        .draft-dialog {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.7);
        }

        .draft-dialog.open { display: flex; }

        .draft-panel {
            width: min(900px, 100%);
            max-height: 90vh;
            overflow: auto;
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-surface);
        }

        .draft-panel h2 { margin-bottom: 8px; }
        .draft-help { color: var(--text-muted); margin-bottom: 20px; }
        .draft-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .draft-fields input { width: 100%; padding: 10px; color: var(--text-main); background: var(--bg-base); border: 1px solid var(--border); border-radius: 6px; }
        .draft-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .draft-section h3 { margin-bottom: 10px; font-size: 0.9rem; }
        .app-source, .layout-zone { min-height: 48px; padding: 10px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-base); }
        .app-source { cursor: grab; }
        .layout-zone { border-style: dashed; }
        .layout-zone.assigned { border-style: solid; border-color: var(--accent-green); }
        .zone-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px; }
        .draft-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
        .btn-secondary { padding: 9px 14px; color: var(--text-main); background: transparent; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }

        @media (max-width: 650px) {
            .draft-fields, .draft-columns { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-group">
            <h1>BIOMES</h1>
            <p>Workspace Automation Engine</p>
        </div>
        <button class="btn-create" onclick="createBiomeOnWallpaper()">
            <span>+</span> Create New Biome
        </button>
    </header>

    <main>
        <div class="section-title">Saved Workspaces</div>

        <div id="biomes-container" class="biomes-grid">
            <div class="add-card" onclick="createBiomeOnWallpaper()">
                <div class="plus-icon">+</div>
                <div style="font-weight: 600;">Create New Biome</div>
            </div>
        </div>
    </main>

    <div id="draft-dialog" class="draft-dialog" role="dialog" aria-modal="true" aria-labelledby="draft-title">
        <div class="draft-panel">
            <h2 id="draft-title">Save new Biome</h2>
            <p class="draft-help">Drag an active application onto each layout zone. Press Enter in the grid editor when you are ready to reach this screen.</p>
            <div class="draft-fields">
                <input id="draft-name" type="text" maxlength="80" placeholder="Biome name, e.g. Coding">
                <input id="draft-hotkey" type="text" maxlength="30" placeholder="Optional hotkey, e.g. CTRL+ALT+C">
            </div>
            <div class="draft-columns">
                <section class="draft-section">
                    <h3>Active applications</h3>
                    <div id="draft-apps"></div>
                </section>
                <section class="draft-section">
                    <h3>Layout zones</h3>
                    <div id="draft-zones"></div>
                </section>
            </div>
            <div class="draft-actions">
                <button class="btn-secondary" onclick="cancelDraft()">Cancel</button>
                <button class="btn-launch" style="flex:0; padding:9px 16px" onclick="saveDraft()">Save Biome</button>
            </div>
        </div>
    </div>

    <script>
        let draft = null;

        // Send IPC command to C++
        function sendIPC(action, payload = {}) {
            if (window.chrome && window.chrome.webview) {
                const message = { action, ...payload };
                console.log('[IPC SEND]', message);
                window.chrome.webview.postMessage(message);
            }
        }

        // Trigger native Win32 Grid Overlay over Wallpaper
        function createBiomeOnWallpaper() {
            sendIPC('CREATE_NEW_BIOME');
        }

        // Activate a saved Biome
        function activateBiome(biomeId) {
            sendIPC('ACTIVATE_BIOME', { id: biomeId });
        }

        // Delete a Biome
        function deleteBiome(biomeId) {
            sendIPC('DELETE_BIOME', { id: biomeId });
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
        }

        function openDraft(boxes) {
            draft = { boxes, apps: [] };
            document.getElementById('draft-dialog').classList.add('open');
            document.getElementById('draft-name').focus();
            renderDraft();
            sendIPC('GET_ACTIVE_WINDOWS');
        }

        function cancelDraft() {
            draft = null;
            document.getElementById('draft-dialog').classList.remove('open');
        }

        function renderDraft() {
            if (!draft) return;
            const apps = document.getElementById('draft-apps');
            const zones = document.getElementById('draft-zones');
            apps.innerHTML = draft.apps.length
                ? draft.apps.map(app => `<div class="app-source" draggable="true" ondragstart="startAppDrag(event, '${escapeHtml(app)}')">${escapeHtml(app)}</div>`).join('')
                : '<div class="draft-help">No normal application windows found. Open an app and reopen this editor.</div>';
            zones.innerHTML = draft.boxes.map((box, index) => `
                <div class="layout-zone ${box.assignedApp ? 'assigned' : ''}" ondragover="event.preventDefault()" ondrop="assignApp(event, ${index})">
                    <div class="zone-label">Display ${box.monitorIndex + 1}, zone ${index + 1}</div>
                    <strong>${box.assignedApp ? escapeHtml(box.assignedApp) : 'Drop an application here'}</strong>
                </div>`).join('');
        }

        function startAppDrag(event, app) {
            event.dataTransfer.setData('text/plain', app);
            event.dataTransfer.effectAllowed = 'copy';
        }

        function assignApp(event, index) {
            event.preventDefault();
            if (!draft) return;
            draft.boxes[index].assignedApp = event.dataTransfer.getData('text/plain');
            renderDraft();
        }

        function saveDraft() {
            if (!draft) return;
            const name = document.getElementById('draft-name').value.trim();
            const hotkey = document.getElementById('draft-hotkey').value.trim();
            if (!name) { alert('Give this Biome a name before saving.'); return; }
            if (!draft.boxes.some(box => box.assignedApp)) { alert('Assign at least one application to a layout zone.'); return; }
            sendIPC('SAVE_BIOME', { name, hotkey, boxes: draft.boxes });
        }

        // Render Biome Cards from C++ JSON payload
        function renderBiomes(biomes) {
            const container = document.getElementById('biomes-container');
            
            // Remove existing cards except the "Add New" button
            const addCardHtml = `
                <div class="add-card" onclick="createBiomeOnWallpaper()">
                    <div class="plus-icon">+</div>
                    <div style="font-weight: 600;">Create New Biome</div>
                </div>
            `;

            let cardsHtml = '';
            biomes.forEach(biome => {
                const appChips = biome.apps ? biome.apps.map(app => `<span class="app-chip">${app}</span>`).join('') : '';
                
                cardsHtml += `
                    <div class="biome-card">
                        <div class="biome-cover">
                            ${biome.cover 
                                ? `<img src="${biome.cover}" alt="${biome.name}">` 
                                : `<span class="fallback-icon">🖥️</span>`}
                        </div>
                        <div class="biome-body">
                            <div class="biome-header">
                                <span class="biome-name">${biome.name}</span>
                                ${biome.hotkey ? `<span class="hotkey-badge">${biome.hotkey}</span>` : ''}
                            </div>
                            <div class="app-list-preview">${appChips}</div>
                            <div class="biome-actions">
                                <button class="btn-launch" onclick="activateBiome('${biome.id}')">Launch</button>
                                <button class="btn-delete" onclick="deleteBiome('${biome.id}')">✕</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = cardsHtml + addCardHtml;
        }

        // IPC Listener for data sent from C++ Engine
        window.addEventListener('DOMContentLoaded', () => {
            if (window.chrome && window.chrome.webview) {
                // Request saved Biomes on startup
                sendIPC('GET_SAVED_BIOMES');

                window.chrome.webview.addEventListener('message', (event) => {
                    const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                    
                    if (data.action === "LOADED_BIOMES") {
                        renderBiomes(data.biomes || []);
                    } else if (data.action === "GRID_LAYOUT_READY") {
                        openDraft(data.boxes || []);
                    } else if (data.action === "ACTIVE_WINDOWS_LIST" && draft) {
                        draft.apps = [...new Set((data.windows || []).map(windowInfo => windowInfo.process).filter(Boolean))];
                        renderDraft();
                    } else if (data.action === "BIOME_SAVED") {
                        cancelDraft();
                    } else if (data.action === "STATUS") {
                        console.log('Biomes:', data.payload);
                    }
                });
            }
        });
    </script>
</body>
</html>
